[package]
name = "wmo"
version = "1.0.1"
edition = "2021"
description = "Isla dinámica flotante para controlar la música en Windows 11 (Tauri 2 + Rust)"
license = "MIT"
repository = "https://github.com/buccellaluciano/win-media-overlay"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.61.3", features = [
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Graphics_Dxgi",
    "Win32_UI_Shell",
    "UI_Notifications",
    "UI_Notifications_Management",
    "ApplicationModel",
] }

# ponytail: AV/binary hygiene. No panic=abort: the panic hook must keep working.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"
